services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_news"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/crypto_news
      LOG_LEVEL: INFO
      BINANCE_BASE_URL: https://api.binance.com
      CRAWLER_USER_AGENT: CryptoNewsResearchBot/1.0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.main"]

volumes:
  postgres_data:
