name: Release CI

on:
  push:
    paths:
      - "frontend/**"
      - "**/*.py"
      - "scripts/**"
      - "database/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "frontend/**"
      - "**/*.py"
      - "scripts/**"
      - "database/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without downloading research LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository size and credentials
        run: python scripts/check_repository_ready.py

  python-release-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without downloading research LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release-test dependencies
        run: >-
          python -m pip install pytest pandas numpy pyarrow scikit-learn
          psycopg2-binary python-dotenv

      - name: Run Python release and migration tests
        run: >-
          python -m pytest -q
          tests/test_migration_008_static.py
          tests/test_release_candidate.py
          tests/test_import_events.py
          tests/test_data_quality_v2.py
          tests/test_website_asset_classification.py
          tests/test_asset_detector.py

  migration-008-disposable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source without downloading research LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL test dependency
        run: python -m pip install psycopg2-binary

      - name: Apply, reapply, concurrency-test, and roll back migration 008
        run: >-
          python -m scripts.database.test_migration_008_disposable
          --database-url postgresql://postgres:postgres@127.0.0.1:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source without downloading research LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Scan client bundle for server credentials
        run: npm run security:bundle
